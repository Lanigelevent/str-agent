# English messages (messages_en.properties)
# McpBridge
error.rate_limit.exceeded=Too many requests. Please retry after a moment (Rate limit exceeded)
error.unauthorized=Unauthorized (please get MCP token from Str Agent settings)
error.method_not_allowed=POST only (MCP Streamable HTTP)
error.request_too_large=Request body exceeds the 8 MB limit (413)
error.internal=Internal error
error.bad_json=Request body is not valid JSON (-32700 ParseError)
error.unknown_tool=Unknown tool: {0} (use tools/list to see catalog)
error.unknown_method=Unknown MCP method: {0}
error.get_only=GET only
error.cancelled=Request cancelled

# DatabaseTool
error.db.connection_not_found=Database connection not found: {0} (please connect first with stragent_db_connect)
error.db.readonly_only=Security restriction: only SELECT/WITH queries allowed (current SQL starts with "{0}"). Write operations must be executed in a database management tool.
error.db.forbidden_keyword=Security restriction: SQL contains forbidden keyword "{0}" (read-only mode does not allow data modification)
error.db.forbidden_source=Security restriction: SQL references file/network source "{0}" (read-only queries may only access the connected database)
error.db.timeout=Security restriction: query cancelled after {0}s (narrow the scope or add filters)
error.db.multi_statement=Security restriction: only a single SQL statement is allowed (multi-statement detected)
error.db.invalid_identifier=Security restriction: invalid identifier "{0}" (letters/digits/underscore only, optional schema prefix)
error.db.param_required={0} cannot be empty
error.db.describe_table=Describe table structure (column names, types). Parameters: connectionId, tableName.
error.db.sample_rows=Sample table data (first N rows). Parameters: connectionId, tableName, rowCount (default 5).
error.db.column_distribution=Column distribution statistics (count/distinct/null/min/max for numbers). Parameters: connectionId, tableName, columnName.

# FollowupProvenance (T-073)
followup.provenance.not_wired=Provenance layer not wired; attribution unavailable.
followup.provenance.no_steps=No provenance steps for this dataset in the current process (import or analysis tools must be called via MCP first).
followup.provenance.no_match=Numbers in the answer matched no recorded step's numeric surface — they come from the brief's deterministic computation, not a tool call; call stragent_provenance to review the whole chain.
followup.provenance.ok=provenanceRef.step is the 0-based index into stragent_provenance's steps array (stable within the process); matched lists the cited numbers found on that step's numeric surface (args/result). Replay those indices via stragent_provenance to verify.

# FaultInjection readiness (T-074)
datasetstore.corrupt_entry_skipped=Persisted dataset entry corrupted; skipped (startup recovery must not die on one bad entry)
import.persisted_note=Dataset not persisted (disk write failure or per-entry size cap) — usable in this session, re-import after restart
import.evicted_note=Oldest datasets evicted from disk by LRU (recent ones kept; still available in this session, re-import after restart)
kvbackup.bad_json=Backup file is not valid JSON: {0}
kvbackup.missing_entries=Backup file is missing the entries object (not a KvBackup snapshot)
elicit.followup_missing_message=followUp is missing message: the second round also needs a one-line question
elicit.desc.multi_round=Two rounds supported (T-077): with followUp, a first-round accept triggers a second round reusing the same pending id (form -> validate -> ask again); first-round decline/cancel is respected and no follow-up is asked.
elicit.followup_field_desc=Second-round follow-up (T-077): {message, fields?, required?}, same shape as round one. Sent only when round one returns accept; reuses the same pending id to correlate the two rounds (the 2026-07-28 spec allows multiple elicitation/create calls; same-id is this project's follow-up correlation semantics — clients treat it as a normal request).
elicit.answer_title=Answer
error.action.dataset=Import a dataset with stragent_import_table, or list available ones with stragent_list_datasets, then retry
error.action.column=Verify the column name (and its role/type) against the column list from stragent_list_datasets, then retry
error.action.param_missing=The error names the missing item; fill it in and retry
error.action.quota=Clean up unused data or narrow the request, then retry
error.action.file=Verify the file path (relative paths resolve against the working directory), then retry
error.action.format=Verify the file/response format (supported formats are listed in the tool description), then retry
error.action.config=Fill in the required service credential/endpoint in configuration, then retry
error.action.fallback=Fix the call per the error message, then retry
error.next_action_prefix=Next step: {0}
error.response_too_large=Tool response {0}MB exceeds the {1}MB response cap: narrow the request (smaller limit / pagination / shorter text), or export with stragent_export_report and deliver it as a file.

# D25 review: CLI face copy goes through i18n (no inline Chinese in HostMain)
cli.help=str-agent MCP host\nUsage: java -jar host-*-all.jar [mode] [--transport stdio|http]\n\nModes:\n  serve            Start host (default; stdio or HTTP per --transport)\n  list-tools       Print current-form tool catalog JSON (same source as tools/list)\n  manifest         Print plugin manifest JSON\n  dsh-manifest     Print the reference harness manifest JSON\n  token            Print static Bearer token (rejected when OAuth enabled)\n  capabilities     Print plugin capabilities\n  kv-export <path> Export kv snapshot to file\n  kv-import <path> Import kv snapshot (missing keys only by default)\n  help             This help
Modes:
  serve            Start host (default; stdio or HTTP per --transport)
  list-tools       Print current-form tool catalog JSON (same source as tools/list)
  manifest         Print plugin manifest JSON
  dsh-manifest     Print the reference harness manifest JSON
  token            Print static Bearer token (rejected when OAuth enabled - see D6 section 2.2.1)
  capabilities     Print plugin capabilities
  kv-export <path> Export kv snapshot to file
  kv-import <path> Import kv snapshot (missing keys only by default)
  help             This help
cli.transport.invalid=--transport must be stdio or http (got: '{value}')
cli.unknown.mode=Unknown mode: {mode} (available: serve / manifest / dsh-manifest / token / capabilities / list-tools / kv-export / kv-import / interactive-batch / help)
cli.oauth.reject=OAuth is enabled (remote bind + STRAGENT_OAUTH_ISSUER set): the static Bearer is no longer accepted by /mcp; obtain a JWT from that IdP. This command no longer prints a static token.
