# 中文消息（messages_zh.properties）
# McpBridge
error.rate_limit.exceeded=请求过于频繁，请稍后重试（Rate limit exceeded）
error.unauthorized=Unauthorized（请在 Str Agent 设置页获取 MCP token）
error.method_not_allowed=仅支持 POST（MCP Streamable HTTP）
error.request_too_large=请求体超过 8MB 上限（413）
error.internal=内部错误
error.bad_json=请求体不是合法的 JSON（-32700 ParseError）
error.unknown_tool=未知工具: {0}（用 tools/list 查看目录）
error.unknown_method=未知 MCP 方法: {0}
error.get_only=仅支持 GET
error.cancelled=请求已取消

# DatabaseTool
error.db.connection_not_found=数据库连接不存在：{0}（请先用 stragent_db_connect 连接）
error.db.readonly_only=安全限制：只允许 SELECT/WITH 查询（当前 SQL 以「{0}」开头）。如需写操作，请在数据库管理工具中执行。
error.db.forbidden_keyword=安全限制：SQL 包含禁止操作「{0}」（只读模式不允许数据修改）
error.db.forbidden_source=安全限制：SQL 引用了文件/网络数据源「{0}」（只读查询只能访问已连接的数据库）
error.db.timeout=安全限制：查询超过 {0} 秒已取消（请缩小范围或增加过滤条件）
error.db.multi_statement=安全限制：只允许单条 SQL 语句（检测到多条语句拼接）
error.db.invalid_identifier=安全限制：非法标识符「{0}」（只允许字母/数字/下划线，可带 schema 前缀）
error.db.param_required={0} 不能为空
error.db.describe_table=描述表结构（列名、类型）。参数：connectionId、tableName。
error.db.sample_rows=采样表数据（前 N 行）。参数：connectionId、tableName、rowCount（缺省 5）。
error.db.column_distribution=统计列的分布（count/distinct/null/min/max for numbers）。参数：connectionId、tableName、columnName。

# FollowupProvenance (T-073)
followup.provenance.not_wired=溯源层未接线，无法归因。
followup.provenance.no_steps=本数据集在本进程内还没有分析留痕（导入或分析工具经 MCP 实际调用后才有步骤可归因）。
followup.provenance.no_match=回答中的数字未命中任何已留痕步骤的数值面——数字来自简报的确定性计算（brief），不是某条工具调用的结果；对全部步骤调 stragent_provenance 可复核整条分析链。
followup.provenance.ok=provenanceRef.step 是 stragent_provenance 返回的 steps 数组下标（0 起，进程内稳定）；matched 是回答引用、且在该步骤数值面（入参/结果）里出现过的数字。对 stragent_provenance 的对应下标重放即可复核引用数字的来路。

# FaultInjection readiness (T-074)
datasetstore.corrupt_entry_skipped=持久化数据集条目损坏，已跳过（重启恢复不因单条坏数据拖死）
import.persisted_note=数据集未落盘（磁盘写入失败或超过单集上限）——本次会话内可用，重启后需重新导入
import.evicted_note=已按 LRU 从落盘淘汰最旧数据集（上限内保留最近使用；本会话内存仍可用，重启后需重新导入）
kvbackup.bad_json=备份文件不是合法 JSON：{0}
kvbackup.missing_entries=备份文件缺少 entries 对象（不是 KvBackup 导出的快照）
elicit.followup_missing_message=followUp 缺少 message：第二轮续问也要一句话说明要问什么
elicit.desc.multi_round=支持两轮（T-077）：传 followUp 时，第一轮 accept 后用**同一 pending id** 续问第二轮（表单 → 校验 → 再问）；第一轮 decline/cancel 则尊重回答、不再追问。
elicit.followup_field_desc=第二轮续问（T-077）：{message, fields?, required?}，结构与第一轮相同。仅在第一轮 action=accept 时发出；复用同一 pending id 关联两轮（2026-07-28 规范允许多次 elicitation/create，同 id 是本项目的续问关联语义，客户端按普通请求处理即可）。回执带 rounds 与 firstContent。
elicit.answer_title=回答
error.action.dataset=先调用 stragent_import_table 导入数据集，或用 stragent_list_datasets 查看可用数据集后重试
error.action.column=用 stragent_list_datasets 的列清单核对列名（及列的角色/类型）后重试
error.action.param_missing=错误信息已点名缺失项，补全该参数后重试
error.action.quota=清理不再使用的数据或缩小请求范围后重试
error.action.file=核对文件路径（相对路径按工作目录解析）后重试
error.action.format=核对文件/响应格式（工具描述里有支持的格式清单）后重试
error.action.config=在配置中补齐所需的服务凭据/地址后重试
error.action.fallback=根据错误说明修正调用参数后重试
error.next_action_prefix=下一步：{0}
error.response_too_large=工具回执 {0}MB 超过响应上限 {1}MB：请缩小请求范围（更小的 limit / 分页 / 缩短文本），或改用 stragent_export_report 导出后按文件交付。

# D25 审查收口：CLI 面文案走 i18n（HostMain 不再内联中文串）
cli.help=str-agent MCP 宿主\n用法：java -jar host-*-all.jar [模式] [--transport stdio|http]\n\n模式：\n  serve            启动宿主（缺省；stdio 或 HTTP 按 --transport）\n  list-tools       打印当前形态工具面 JSON（与 tools/list 同源）\n  manifest         打印插件 manifest JSON\n  dsh-manifest     打印 the reference harness manifest JSON\n  token            打印静态 Bearer token（OAuth 启用时拒绝——见 D6 §2.2.1）\n  capabilities     打印插件能力清单\n  kv-export <path> 导出 kv 快照到文件\n  kv-import <path> 从快照导入 kv（默认只补缺失键）\n  help             本帮助
模式：
  serve            启动宿主（缺省；stdio 或 HTTP 按 --transport）
  list-tools       打印当前形态工具面 JSON（与 tools/list 同源）
  manifest         打印插件 manifest JSON
  dsh-manifest     打印 the reference harness manifest JSON
  token            打印静态 Bearer token（OAuth 启用时拒绝——见 D6 §2.2.1）
  capabilities     打印插件能力清单
  kv-export <path> 导出 kv 快照到文件
  kv-import <path> 从快照导入 kv（默认只补缺失键）
  help             本帮助
cli.transport.invalid=--transport 取值只能是 stdio 或 http（收到：'{value}'）
cli.unknown.mode=未知参数：{mode}（可用：serve / manifest / dsh-manifest / token / capabilities / list-tools / kv-export / kv-import / interactive-batch / help）
cli.oauth.reject=OAuth 已启用（远程绑定 + STRAGENT_OAUTH_ISSUER 已配置）：静态 Bearer 不再被 /mcp 接受，请从该 IdP 获取 JWT。本命令不再打印静态 token。
