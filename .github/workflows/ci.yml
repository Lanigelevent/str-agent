name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CJK fonts (PDF/Batik rendering)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-wqy-microhei fontconfig
      - name: Run test suites (all modules)
        run: ./gradlew cleanTest :core:test :str-agent:test :data:test :engine-duckdb:test :host:test --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - name: Static analysis (warning-budget ratchet)
        run: python scripts/lint.py
